# fly.io config for the bevy-trickshot game server.
#
# First-time setup (run from the REPO ROOT — the Docker build context is the
# whole workspace, and fly resolves --config/Dockerfile relative to the path arg):
#
#   fly apps create bevy-trickshot-server            # or another unique name; then update `app` below
#   fly ips allocate-v4                              # dedicated IPv4, ~$2/mo — required, see below
#   fly secrets set LIGHTYEAR_PRIVATE_KEY="$(python3 -c 'import random; print(",".join(str(random.randint(0,255)) for _ in range(32)))')"
#   fly deploy . --config server/fly.toml -a bevy-trickshot-server
#
# Every later deploy is the same `fly deploy . --config server/fly.toml -a ...`.
#
# Notes:
# * UDP on fly.io only ever works over a *dedicated IPv4* — see
#   https://fly.io/docs/networking/udp-and-tcp/: "You need a dedicated IPv4
#   address. You can't use a shared IPv4 address or an IPv6 address for UDP."
#   A dedicated IPv6 (the old setup here) looks like it routes inbound
#   traffic fine, but public UDP over IPv6 isn't actually supported, and every
#   reply silently vanishes — see `server::net::bind_addr`'s doc comment for
#   why (short version: bind to `fly-global-services`, never a wildcard).
# * fly needs BOTH a udp and a tcp service on the same port for UDP to route.
#   The server answers TCP with a one-line health reply (`server/src/health.rs`).
# * The machine only runs while someone's playing. The server exits once
#   nobody's been connected for IDLE_SHUTDOWN_MINS (`server/src/net.rs`), and
#   since that's a clean exit, the restart policy below leaves the machine
#   stopped (billed only for its disk, a few cents a month). A client wakes it
#   by knocking on the TCP port (`shared/src/wake.rs`): fly's proxy starts a
#   stopped machine for any connection to a service with auto_start_machines.
#   fly's own auto_stop stays OFF: the proxy only sees TCP, not the game's UDP,
#   so it would think a full match was idle and stop the machine mid-game.
#   `server/test-wake.sh` checks the stop → wake round trip.
# * performance-1x is a dedicated core: shared-cpu machines get 1/16 of a core
#   plus a few minutes of burst, and a high zombies round outruns that — the
#   server gets throttled below its tick rate and every zombie and remote
#   player freezes on the clients.

app = "bevy-trickshot-server"
primary_region = "iad"          # pick the region nearest you and your friends

[env]
  PORT = "5000"
  RUST_LOG = "info"
  IDLE_SHUTDOWN_MINS = "10"

# Restart a crash, but not the clean exit of an idle shutdown.
[[restart]]
  policy = "on-failure"
  retries = 5

# --- game traffic (UDP) ---
[[services]]
  internal_port = 5000
  protocol = "udp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 5000

# --- required TCP companion for UDP routing ---
[[services]]
  internal_port = 5000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 5000

[[vm]]
  size = "performance-1x"
  memory = "2gb"
